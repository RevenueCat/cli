[tools]
# Provisioned so `mise exec -- make check` (the lefthook pre-commit) runs lint —
# without it the forbidigo bans only fire in CI. Pinned to the CI version.
golangci-lint = "2.12.2"

[settings]
idiomatic_version_file_enable_tools = ["go", "node"]
minimum_release_age = "7d"
minimum_release_age_excludes = [
  "node", # can be removed after 2026-11-04, needed for the first lithium release
]
