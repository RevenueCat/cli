name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install Python deps for codegen
        run: pip install pyyaml

      - name: Verify generated types are up to date
        run: |
          cp internal/api/types_gen.go /tmp/types_gen_committed.go
          make gen
          if ! diff -q internal/api/types_gen.go /tmp/types_gen_committed.go > /dev/null 2>&1; then
            echo "::error::internal/api/types_gen.go is out of date. Run 'make gen' and commit the result."
            diff /tmp/types_gen_committed.go internal/api/types_gen.go || true
            exit 1
          fi

      - name: gofmt
        run: |
          out=$(gofmt -l ./internal ./cmd)
          if [ -n "$out" ]; then
            echo "::error::unformatted files:"; echo "$out"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage report
        run: go tool cover -func=coverage.out | tail -1
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
