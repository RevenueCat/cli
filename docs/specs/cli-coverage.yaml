  - method: POST
    path: /projects/{project_id}/entitlements/{entitlement_id}
  - method: DELETE
    path: /projects/{project_id}/entitlements/{entitlement_id}
  - method: POST
    path: /projects/{project_id}/entitlements/{entitlement_id}/actions/archive
  - method: POST
    path: /projects/{project_id}/entitlements/{entitlement_id}/actions/unarchive
  - method: GET
    path: /projects/{project_id}/entitlements/{entitlement_id}/products
  - method: POST
    path: /projects/{project_id}/entitlements/{entitlement_id}/actions/attach_products
  - method: POST
    path: /projects/{project_id}/entitlements/{entitlement_id}/actions/detach_products

