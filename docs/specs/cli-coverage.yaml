# Maps RevenueCat v2 Developer API spec endpoints to CLI implementation.
# Used by scripts/spec-diff.py --coverage to classify spec changes by severity:
#   CRITICAL = CLI-implemented endpoint has a breaking change
#   WARNING  = CLI-implemented endpoint changed non-breakingly or deprecated
#   NEW      = spec endpoint not yet in CLI
#   INFO     = change to an endpoint the CLI doesn't use
#
# Update this file whenever internal/api/ gains or loses endpoints.

endpoints:
  # Projects
  - method: GET
    path: /projects
  - method: POST
    path: /projects
  - method: GET
    path: /projects/{project_id}

  # Apps
  - method: GET
    path: /projects/{project_id}/apps
  - method: POST
    path: /projects/{project_id}/apps
  - method: GET
    path: /projects/{project_id}/apps/{app_id}
  - method: POST
    path: /projects/{project_id}/apps/{app_id}
  - method: DELETE
    path: /projects/{project_id}/apps/{app_id}
  - method: GET
    path: /projects/{project_id}/apps/{app_id}/public_api_keys
  - method: GET
    path: /projects/{project_id}/apps/{app_id}/store_kit_config

  # Customers
  - method: GET
    path: /projects/{project_id}/customers
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/active_entitlements
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/aliases
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/attributes
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/attributes
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/actions/assign_offering
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/actions/grant_entitlement
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/actions/restore_purchase_by_order_id
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/actions/revoke_granted_entitlement
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/actions/transfer
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/invoices
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/purchases
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/subscriptions
  - method: GET
    path: /projects/{project_id}/customers/{customer_id}/virtual_currencies
  - method: POST
    path: /projects/{project_id}/customers/{customer_id}/virtual_currencies/update_balance
  - method: POST
