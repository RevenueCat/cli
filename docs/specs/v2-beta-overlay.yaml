                  status:
                    type: string
                    enum:
                    - draft
                    example: draft
                additionalProperties: false
          headers:
            RevenueCat-Rate-Limit-Current-Usage:
              $ref: '#/components/headers/RateLimitCurrentUsage'
            RevenueCat-Rate-Limit-Current-Limit:
              $ref: '#/components/headers/RateLimitCurrentLimit'
  /projects/{project_id}/store_state/plans/{plan_id}/actions/plan:
    post:
      summary: Trigger product store state plan generation
      description: "Queues asynchronous planning for the specified product store state\
        \ plan.\n This endpoint requires the following permission(s): <code>project_configuration:products:read_write</code>.\
        \ This endpoint belongs to the <strong>Project Configuration</strong> domain,\
        \ which has a default rate limit of <strong>60 requests per minute</strong>."
      operationId: plan-product-store-state-plan
      x-revenuecat-rate-limiting-domain: project_configuration
      x-scopes:
      - project_configuration:products:read_write
      x-release-status: development
      x-revenuecat-mcp-include: false
      x-revenuecat-mcp-description: Queues asynchronous planning for a draft or replannable
        product store state plan. Planning validates the desired states, compares
        them to the current store state, computes per-product diffs and warnings,
        and resolves `common.pricing.equalize_missing_subscription_prices` for App
        Store subscriptions when that directive is present. Call this after creating
        or updating a plan, then poll get-product-store-state-plan until status is
        `planned`, `planned_and_finished`, or `plan_errored`. If planning fails or
        returns blocker warnings, update the plan and run this action again.
      x-revenuecat-mcp-return-as-json: true
      x-revenuecat-release-gatekeeping: false
      tags:
      - Product
      parameters:
      - name: project_id
        description: ID of the project
        required: true
        in: path
        schema:
          type: string
          maxLength: 255
          example: proj1ab2c3d4
      - name: plan_id
        description: ID of the product store state plan
        required: true
        in: path
        schema:
          type: string
          format: uuid
          example: 4d5c046e-fadd-4d91-bd78-744fe44d314d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: Product store state plan generation has been queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - status
                - polling_url
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 4d5c046e-fadd-4d91-bd78-744fe44d314d
                  object:
                    type: string
                    enum:
                    - product_store_state_plan
                    example: product_store_state_plan
                  status:
                    type: string
                    enum:
                    - plan_queued
                    example: plan_queued
                  polling_url:
                    type: string
                    minLength: 1
                    maxLength: 2000
                    example: /v2/projects/proj1a2b3c4/store_state/plans/4d5c046e-fadd-4d91-bd78-744fe44d314d
                additionalProperties: false
          headers:
            RevenueCat-Rate-Limit-Current-Usage:
              $ref: '#/components/headers/RateLimitCurrentUsage'
            RevenueCat-Rate-Limit-Current-Limit:
              $ref: '#/components/headers/RateLimitCurrentLimit'
