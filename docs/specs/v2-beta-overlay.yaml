    FlowValidationError:
      type: object
      additionalProperties: true
      required:
      - key
      - message
      - severity
      properties:
        key:
          type: string
          description: Workflow validation error key.
          enum:
          - Workflow_ExperimentRunningCombosOverLimit
          - Workflow_ExperimentPotentialCombosOverLimit
          - Workflow_NoPaywallScreen
          - Workflow_RestoreButtonNotOnFinalScreen
          - Workflow_NoInitialStep
