      description: "Queues asynchronous apply for the specified planned product store\
        \ state plan.\n This endpoint requires the following permission(s): <code>project_configuration:products:read_write</code>.\
        \ This endpoint belongs to the <strong>Project Configuration</strong> domain,\
        \ which has a default rate limit of <strong>60 requests per minute</strong>."
      operationId: apply-product-store-state-plan
      x-revenuecat-rate-limiting-domain: project_configuration
      x-scopes:
      - project_configuration:products:read_write
      x-release-status: development
      x-revenuecat-mcp-include: false
      x-revenuecat-mcp-description: Queues asynchronous apply for a planned or retryable
        product store state plan. Before calling this, call get-product-store-state-plan
        and confirm the plan has an `apply` action, review the diffs and warnings,
        and make sure the user wants the changes applied to the store. Applying may
        create products, update App Store metadata, availability, pricing, localizations,
        screenshots, and fill missing subscription territory prices when `common.pricing.equalize_missing_subscription_prices`
        was included. After queueing apply, poll get-product-store-state-plan until
        status is `applied` or `apply_errored`; if a 423 lock occurs, inspect the
        referenced object ids and retry after the conflicting operation finishes.
      x-revenuecat-mcp-return-as-json: true
      x-revenuecat-release-gatekeeping: false
      tags:
      - Product
