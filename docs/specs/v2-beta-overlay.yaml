          - Workflow_CheckoutNoSuccessStep
          - Workflow_NoWebConfig
          - Workflow_NoWebProducts
          - Workflow_ExclusiveRuleMixedOutcome
          - Workflow_CookieConsentNoPrivacyPolicy
          example: Workflow_ExperimentRunningCombosOverLimit
        message:
          description: A human-readable description of the issue.
          type: string
          example: Add a name to your paywall.
        severity:
          description: The severity of the validation issue.
          type: string
          enum:
          - error
          - warning
          example: error
        action:
          type: string
          description: Suggested action to resolve the issue.
          nullable: true
          example: add_screen
    FlowDraft:
      type: object
      required:
      - object
      - id
      - type
      - revision
      - display_name
      - initial_step_id
      - single_step_fallback_id
      - app_id
      - metadata
      - custom_context_parameters_config
      - content_max_width
      - steps
      properties:
        object:
          type: string
          description: Type of this object.
          example: flow_draft
          enum:
          - flow_draft
        id:
          type: string
          description: Flow ID.
          example: wf_123456789a
        type:
          type: string
          description: Flow type.
          example: web-funnel
          enum:
          - paywall
          - web-funnel
          - general
        revision:
          type: integer
          description: Current draft revision. Saves must supply this value to reject
            stale writes.
          example: 1
          format: int64
          minimum: 1
        display_name:
          type: string
          description: Display name of the flow.
          example: Onboarding
          minLength: 1
          maxLength: 1500
        initial_step_id:
          type: string
          description: ID of the first step.
          example: welcome
          nullable: true
          maxLength: 255
        single_step_fallback_id:
          type: string
          description: Fallback screen for clients that cannot present multiple steps.
          example: paywall
          nullable: true
          maxLength: 255
        app_id:
          type: string
          description: Web billing app ID.
          example: app123456789a
          nullable: true
          maxLength: 200
        metadata:
          type: object
          description: Flow metadata, including web funnel settings.
          example: {}
          additionalProperties: true
          nullable: true
        custom_context_parameters_config:
          type: object
          description: Custom context parameters.
          example: {}
          additionalProperties: true
        content_max_width:
          type: integer
          description: Maximum web content width.
          example: 600
          nullable: true
          minimum: 1
        steps:
          type: object
          description: Editable draft steps keyed by stable step ID.
          example: {}
          additionalProperties:
            $ref: '#/components/schemas/FlowStep'
          maxProperties: 1000
      additionalProperties: true
    UpdateFlowDraft:
      type: object
      additionalProperties: false
      required:
      - revision
      properties:
        revision:
          type: integer
          description: Current draft revision. Saves must supply this value to reject
            stale writes.
          example: 1
          format: int64
          minimum: 1
        display_name:
          type: string
          description: Display name of the flow.
          example: Onboarding
          minLength: 1
          maxLength: 1500
        initial_step_id:
          type: string
          description: ID of the first step.
          example: welcome
          nullable: true
          maxLength: 255
        single_step_fallback_id:
          type: string
          description: Fallback screen for clients that cannot present multiple steps.
          example: paywall
          nullable: true
          maxLength: 255
        app_id:
          type: string
          description: Web billing app ID.
          example: app123456789a
          nullable: true
          maxLength: 200
        metadata:
          type: object
          description: Flow metadata, including web funnel settings.
          example: {}
          additionalProperties: true
          nullable: true
        custom_context_parameters_config:
          type: object
          description: Custom context parameters.
          example: {}
          additionalProperties: true
        content_max_width:
          type: integer
          description: Maximum web content width.
          example: 600
          nullable: true
          minimum: 1
        updated_steps:
          type: object
          description: Steps to create or update. Omitted steps are preserved. Step fields
            are patches; omitted or null fields preserve stored values, except explicit
            paywall=null on an authentication step.
          example: {}
          additionalProperties:
            $ref: '#/components/schemas/FlowStep'
          maxProperties: 1000
        deleted_step_ids:
          type: array
          description: Draft steps to delete explicitly. A step cannot also appear in
            updated_steps.
          items:
