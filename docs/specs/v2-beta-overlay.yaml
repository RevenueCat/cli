    ListFlows:
      type: object
      required:
      - items
      - next_page
      - object
      - url
      title: FlowList
      properties:
        object:
          description: String representing the object's type. Objects of the same type
            share the same value. Always has the value `list`.
          enum:
          - list
          type: string
        items:
          description: Details about each object.
          items:
            $ref: '#/components/schemas/Flow'
          type: array
        next_page:
          description: URL to access the next page of the project's Flows. If not present
            / null, there is no next page
          type: string
          nullable: true
          example: /v2/projects/proj1ab2c3d4/flows?starting_after=wrkflw1a2b3c4d5
        url:
          description: The URL where this list can be accessed.
          maxLength: 5000
          type: string
          example: /v2/projects/proj1ab2c3d4/flows
      additionalProperties: false
    Flow:
      type: object
      required:
      - object
      - id
      - name
      - created_at
      - project_id
      - type
      - published_at
      - has_unpublished_changes
      - revision
      properties:
        object:
          description: String representing the object's type. Objects of the same type
            share the same value.
          enum:
          - flow
          type: string
        id:
          description: The id of the Flow
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
          example: wf_1a2b3c4d5
        name:
          description: The display name of the Flow
          nullable: false
          type: string
          minLength: 1
          maxLength: 1500
          example: My offering flow
        created_at:
          description: The date the Flow was created at in ms since epoch
          nullable: false
          type: integer
          format: int64
          example: 1658399423658
        project_id:
          description: ID of the project to which the Flow belongs
          nullable: false
          minLength: 1
          maxLength: 20
          type: string
          example: proj1ab2c3d4
        type:
          description: The type of the Flow. `general` means it has no specific type.
          nullable: false
          type: string
          enum:
          - paywall
          - web-funnel
          - general
          example: paywall
        published_at:
          description: The date the Flow was last published in ms since epoch, or null
            if it has never been published
          nullable: true
          type: integer
          format: int64
          example: 1658399423658
        has_unpublished_changes:
          description: Whether the Flow has draft changes that are not published yet.
            Always true for a Flow that has never been published.
          nullable: false
          type: boolean
          example: false
        revision:
          type: integer
          format: int64
          description: Current draft revision.
          example: 1
      additionalProperties: false
    CreateFlow:
      type: object
      required:
      - display_name
      additionalProperties: false
      properties:
        type:
          type: string
          description: Flow type.
          example: web-funnel
          enum:
          - paywall
          - web-funnel
          - general
          default: general
        display_name:
          type: string
          description: Display name of the flow.
          example: Onboarding
          minLength: 1
          maxLength: 1500
        initial_step_id:
          type: string
          description: ID of the first step.
          example: welcome
          nullable: true
          maxLength: 255
        single_step_fallback_id:
          type: string
          description: Fallback screen for clients that cannot present multiple steps.
          example: paywall
          nullable: true
          maxLength: 255
        app_id:
          type: string
          description: Web billing app ID.
          example: app123456789a
          nullable: true
          maxLength: 200
        metadata:
          type: object
          description: Flow metadata, including web funnel settings.
          example: {}
          additionalProperties: true
          nullable: true
        custom_context_parameters_config:
          type: object
          description: Custom context parameters.
          example: {}
          additionalProperties: true
        content_max_width:
          type: integer
          description: Maximum web content width.
          example: 600
          nullable: true
          minimum: 1
        steps:
          type: object
          description: Editable draft steps keyed by stable step ID.
          example: {}
          additionalProperties:
            $ref: '#/components/schemas/FlowStep'
          maxProperties: 1000
    FlowStep:
      type: object
      properties:
        name:
          type: string
          description: Display name of the step.
          example: Welcome
          nullable: true
        type:
          type: string
          description: Required when creating a step.
          example: screen
          enum:
          - screen
          - checkout
          - authentication
          - branch
          - experiment
          - offering
          - ad
        param_values:
          type: object
          description: Step-specific configuration.
          example: {}
          additionalProperties: true
        trigger_actions:
          type: object
          description: Navigation and actions keyed by trigger.
          example: {}
          additionalProperties: true
        triggers:
          type: array
          description: Step triggers.
          example: []
          items: {}
        outputs:
          type: object
          description: Output definitions keyed by component ID.
          example: {}
          additionalProperties: true
        paywall_rc_public_id:
          type: string
          description: Existing workflow screen in this project. Mutually exclusive with
            paywall.
          example: pw123456789a
          nullable: true
        paywall:
          $ref: '#/components/schemas/FlowScreen'
          description: Inline screen content. Explicit null removes an authentication
            step draft-only owned screen.
          nullable: true
        rc_metadata:
          type: object
          description: Step metadata.
          example: {}
          additionalProperties: true
          nullable: true
        node_position:
          type: object
          required:
          - x
          - y
          properties:
            x:
              type: number
              description: Canvas x coordinate.
              example: 0
            y:
              type: number
              description: Canvas y coordinate.
              example: 0
          additionalProperties: false
          nullable: true
        screen_type:
          type: array
          description: Screen classifications.
          example:
          - initial
          items:
            type: string
            enum:
            - paywall
            - checkout
            - success
            - initial
            - second
            - authentication
            - experiment
            - redirect
          uniqueItems: true
      additionalProperties: false
    FlowScreen:
      type: object
      properties:
        default_locale:
          type: string
          description: Default locale of the screen.
          example: en_US
          nullable: true
        components_config:
          type: object
          description: Raw components configuration, in the same format as paywall drafts.
          example: {}
          additionalProperties: true
        components_localizations:
          type: object
          description: Component values keyed by locale.
          example:
            en_US: {}
          additionalProperties:
            type: object
            additionalProperties: true
        metadata:
          type: object
          description: Screen metadata.
          example: {}
          additionalProperties: true
          nullable: true
        params:
          type: array
          description: Screen parameters.
          example: []
          items:
            type: object
            additionalProperties: true
        offering_id:
          type: string
          description: Offering ID for a paywall fallback screen. An empty string detaches
            the offering.
          example: ofrng123456789a
          nullable: true
        exit_offers:
          type: object
          description: Exit offers. Only used by paywall-type flows.
          example: {}
          additionalProperties: true
          nullable: true
        play_store_product_change_mode:
          type: object
          properties:
            upgrade_replacement_mode:
              type: string
              description: Play Store replacement mode.
              example: deferred
              enum:
              - charge_prorated_price
              - charge_full_price
              - with_time_proration
              - without_proration
              - deferred
              nullable: true
            downgrade_replacement_mode:
              type: string
              description: Play Store replacement mode.
              example: deferred
              enum:
              - charge_full_price
              - with_time_proration
              - without_proration
              - deferred
              nullable: true
          additionalProperties: false
          nullable: true
        automatically_scale_font_size:
          type: boolean
          description: Whether to scale font sizes automatically.
          example: true
        haptic_feedback_enabled:
          type: boolean
          description: Whether selections trigger haptic feedback.
          example: false
        state_declarations:
          type: object
          description: Per-screen state declarations.
          example: {}
          additionalProperties: true
          nullable: true
        generated_by:
          type: string
          description: Origin of the screen.
          example: figma
          nullable: true
      additionalProperties: false
    DuplicateFlow:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Name of the duplicate.
          minLength: 1
          maxLength: 1500
          example: Onboarding Copy
        source_version:
          type: string
          enum:
          - draft
          - published
          default: draft
          description: Which source version to copy. The copy is always unpublished.
          example: draft
    PublishFlow:
      type: object
      additionalProperties: false
      required:
      - revision
      properties:
        revision:
          type: integer
          description: Current draft revision. Saves must supply this value to reject
            stale writes.
          example: 1
          format: int64
          minimum: 1
    ValidateFlow:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          description: Current draft revision. Saves must supply this value to reject
            stale writes.
          example: 1
          format: int64
          minimum: 1
    FlowValidation:
      type: object
      additionalProperties: true
      required:
      - object
      - id
      - valid
      - revision
      - step_issues
      - workflow_errors
      properties:
        object:
          type: string
          enum:
          - flow_validation
          description: Type of this object.
          example: flow_validation
        id:
          type: string
          description: Flow ID.
          example: wf_123456789a
        valid:
          type: boolean
          description: Whether the draft can be published. Warnings do not prevent publication.
          example: false
        revision:
          type: integer
          description: Current draft revision. Saves must supply this value to reject
            stale writes.
          example: 1
          format: int64
          minimum: 1
          nullable: true
        step_issues:
          type: object
          description: Issues keyed by step ID.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FlowValidationIssue'
          example: {}
        workflow_errors:
          type: array
          description: Issues affecting the entire flow.
          items:
            $ref: '#/components/schemas/FlowValidationError'
          example: []
    FlowValidationIssue:
      type: object
      additionalProperties: true
      required:
      - key
      - message
      - severity
      properties:
        key:
          oneOf:
          - $ref: '#/components/schemas/PaywallValidationIssueKey'
          - $ref: '#/components/schemas/FlowValidationIssueKey'
        message:
          description: A human-readable description of the issue.
          type: string
          example: Add a name to your paywall.
        severity:
          description: The severity of the validation issue.
          type: string
          enum:
          - error
          - warning
          example: error
        component_id:
          description: The component associated with the issue.
          type: string
          nullable: true
          example: main_stack
        property:
          description: The component property associated with the issue.
          type: string
          nullable: true
          example: font_size
        locale:
          description: The locale associated with the issue.
          type: string
          nullable: true
          example: en_US
        localization_id:
          description: The localization identifier associated with the issue.
          type: string
          nullable: true
          example: title
        path:
          description: The schema path associated with the issue.
          type: string
          nullable: true
          example: paywall.components_config.base.stack
    PaywallValidationIssueKey:
      description: A stable identifier for a paywall validation issue.
      type: string
      enum:
      - Schema_Invalid
      - Paywall_NoOffering
      - Paywall_NoPackage
      - Paywall_NoName
      - Paywall_NoDefaultPackage
      - Paywall_NoPurchaseFlow
      - Text_NoDefaultText
      - Text_NoIntroText
      - Text_NoMultipleIntroText
      - Text_NoPromoText
      - Text_NoFont
      - Text_DefaultModifier
      - Text_IntroModifier
      - Text_MultipleIntroModifier
      - Text_PromoModifier
