      x-release-status: development
      x-revenuecat-mcp-include: false
      x-revenuecat-mcp-description: "Returns the full product store state plan. Use\
        \ this to poll asynchronous planning or apply work, inspect `actions` before\
        \ choosing the next step, and review `plan_items` for per-product create/modify/unchanged\
        \ actions, diffs, warnings, and apply status. After planning, review warnings\
        \ and blocker messages before applying. After applying, poll this tool until\
        \ the plan reaches `applied` or `apply_errored`; if planning errored, inspect\
        \ `error_message` and per-item `error_message`; if applying errored, inspect\
        \ per-item `apply_error_message`.\nResponse shape — read directly from the\
        \ returned JSON. - `status` is the plan-level lifecycle state (`draft`, `plan_queued`,\n\
        \  `planning`, `planned`, `planned_and_finished`, `plan_errored`,\n  `apply_queued`,\
        \ `applying`, `applied`, `apply_errored`, `discarded`,\n  `cancelled`, `expired`).\
        \ Use this when polling.\n- `actions` lists the next valid actions (`edit`,\
        \ `plan`, `apply`,\n  `discard`) — pick the next step from this list.\n- `summary`\
        \ has `products_added`, `products_modified`,\n  `products_unchanged` for a\
        \ quick rollup.\n- `plan_items[*]` is the per-product detail. For each item:\n\
        \  - `action` is `create` | `modify` | `unchanged`.\n  - `diff[*]` lists `{\
        \ field, from_value, to_value }` where `field` is a\n    dotted path into\
        \ the desired state (e.g.\n    `common.pricing.territory_prices.US`,\n   \
        \ `store_state.base_plans.monthly.state`).\n  - `warnings[*]` is `{ severity,\
        \ field, message }` where `severity` is\n    `info` | `warning` | `blocker`.\
        \ Treat any `blocker` as something the\n    user must fix before applying.\n\
        \  - `error_message` is the per-item planning error (if planning failed\n\
        \    for that item).\n  - `apply_status` is `pending` | `running` | `applied`\
        \ | `failed` |\n    `skipped`, and `apply_error_message` is set when `apply_status\
        \ ==\n    failed`.\n- Plan-level `error_message` is set when the whole plan\
        \ failed planning. - `timestamps` has `created_at`, `planning_at`, `planned_at`,\n\
        \  `applied_at`, `discarded_at`, `cancelled_at`, `expired_at` (ms since\n\
        \  epoch)."
      x-revenuecat-mcp-return-as-json: true
      x-revenuecat-release-gatekeeping: false
      tags:
      - Product
      parameters:
      - name: project_id
        description: ID of the project
        required: true
        in: path
        schema:
          type: string
          maxLength: 255
          example: proj1ab2c3d4
      - name: plan_id
        description: ID of the product store state plan
        required: true
        in: path
        schema:
          type: string
          format: uuid
          example: 4d5c046e-fadd-4d91-bd78-744fe44d314d
      responses:
        '200':
          description: The current status and details for the product store state
            plan.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - status
                - has_changes
                - actions
                - summary
                - timestamps
                - desired_states
                - plan_items
                - error_message
                - warnings
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 4d5c046e-fadd-4d91-bd78-744fe44d314d
                  object:
                    type: string
                    enum:
                    - product_store_state_plan
                    example: product_store_state_plan
                  status:
                    type: string
                    enum:
                    - draft
                    - plan_queued
                    - planning
                    - planned
                    - planned_and_finished
                    - plan_errored
                    - apply_queued
                    - applying
                    - applied
                    - apply_errored
                    - discarded
                    - cancelled
                    - expired
                    example: planned
                  has_changes:
                    type: boolean
                    nullable: true
                    example: true
                  actions:
                    type: array
                    items:
                      type: string
                      enum:
                      - edit
                      - plan
                      - apply
                      - discard
                    example:
                    - edit
                    - apply
                    - discard
                  summary:
                    type: object
                    nullable: true
                    required:
                    - products_added
                    - products_modified
                    - products_unchanged
                    properties:
                      products_added:
                        type: integer
                        format: int64
                        minimum: 0
                        example: 1
                      products_modified:
                        type: integer
                        format: int64
                        minimum: 0
                        example: 0
                      products_unchanged:
                        type: integer
                        format: int64
                        minimum: 0
                        example: 2
                    additionalProperties: false
                  timestamps:
                    type: object
                    required:
                    - created_at
                    - planning_at
                    - planned_at
                    - applied_at
                    - discarded_at
                    - cancelled_at
                    - expired_at
                    properties:
                      created_at:
                        type: integer
                        format: int64
                        example: 1762819200000
                      planning_at:
                        type: integer
                        format: int64
                        nullable: true
                        example: 1762819210000
                      planned_at:
                        type: integer
                        format: int64
                        nullable: true
                        example: 1762819224000
                      applied_at:
                        type: integer
                        format: int64
                        nullable: true
                        example: 1762819260000
                      discarded_at:
                        type: integer
                        format: int64
                        nullable: true
                        example: 1762819300000
                      cancelled_at:
                        type: integer
                        format: int64
                        nullable: true
                        example: 1762819320000
                      expired_at:
                        type: integer
                        format: int64
                        nullable: true
                        example: 1762819340000
                    additionalProperties: false
                  desired_states:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductStoreStatePlanDesiredStateResponse'
                  plan_items:
                    type: array
                    nullable: true
                    items:
                      type: object
                      required:
                      - product_id
                      - app_id
                      - store_identifier
                      - action
                      - diff
                      - warnings
                      - error_message
                      - apply_status
                      - apply_error_message
                      properties:
                        product_id:
                          type: string
                          nullable: true
                          minLength: 1
                          maxLength: 255
                          example: prod1a2b3c4
                        app_id:
                          description: The app ID for a future product targeted by
                            this plan item.
                          type: string
                          nullable: true
                          minLength: 1
                          maxLength: 255
                          example: app1a2b3c4
                        store_identifier:
                          description: The store identifier for the product targeted
                            by this plan item, whether it already exists in RevenueCat
                            or will be created by the plan.
                          type: string
                          nullable: true
                          minLength: 1
                          maxLength: 255
                          example: com.example.app.pro_monthly
                        action:
                          type: string
                          enum:
                          - create
                          - modify
                          - unchanged
                          example: modify
                        diff:
                          type: array
                          items:
                            type: object
                            required:
                            - field
                            - from_value
                            - to_value
                            properties:
                              field:
                                type: string
                                minLength: 1
                                maxLength: 1000
                                example: common.pricing.territory_prices.US
                              from_value:
                                nullable: true
                                oneOf:
                                - type: string
                                - type: number
                                - type: boolean
                                example: $79.99
                              to_value:
                                nullable: true
                                oneOf:
                                - type: string
                                - type: number
                                - type: boolean
                                example: $89.99
                            additionalProperties: false
                        warnings:
                          type: array
                          items:
                            type: object
                            required:
                            - severity
                            - field
                            - message
                            properties:
                              severity:
                                type: string
                                enum:
                                - info
                                - warning
                                - blocker
                                example: warning
                              field:
                                type: string
                                minLength: 1
                                maxLength: 1000
                                example: store_state.review_information.screenshot
                              message:
                                type: string
                                minLength: 1
                                maxLength: 4000
                                example: No review note provided.
                            additionalProperties: false
                        error_message:
                          description: Per-item planning error, when planning failed
                            for this item.
                          type: string
                          nullable: true
                          example: Missing base territory price.
                        apply_status:
                          type: string
                          nullable: true
                          enum:
                          - pending
                          - running
                          - applied
                          - failed
                          - skipped
                          - null
                          example: null
                        apply_error_message:
                          type: string
                          nullable: true
                          example: null
                      additionalProperties: false
                  error_message:
                    type: string
                    nullable: true
                    example: null
                  warnings:
                    type: array
                    description: Top-level warnings about the plan as a whole.
                    items:
                      $ref: '#/components/schemas/ProductStoreStatePlanWarning'
                additionalProperties: false
          headers:
            RevenueCat-Rate-Limit-Current-Usage:
              $ref: '#/components/headers/RateLimitCurrentUsage'
            RevenueCat-Rate-Limit-Current-Limit:
              $ref: '#/components/headers/RateLimitCurrentLimit'
    put:
      summary: Update a product store state plan
      description: "Replaces all desired states in a plan and returns the plan in\
        \ draft status.\n This endpoint requires the following permission(s): <code>project_configuration:products:read_write</code>.\
        \ This endpoint belongs to the <strong>Project Configuration</strong> domain,\
        \ which has a default rate limit of <strong>60 requests per minute</strong>."
      operationId: update-product-store-state-plan
      x-revenuecat-rate-limiting-domain: project_configuration
      x-scopes:
      - project_configuration:products:read_write
      x-release-status: development
      x-revenuecat-mcp-include: false
      x-revenuecat-mcp-description: 'Replaces all desired states in an editable product
        store state plan and moves it back to draft status. This is a full replacement,
        not a patch: include the complete desired_states array that should remain
        in the plan. Use this to fix warnings, add or remove products, adjust metadata,
        or add `common.pricing.equalize_missing_subscription_prices` for App Store
        subscriptions before re-planning. After updating, call plan-product-store-state-plan
        again and poll get-product-store-state-plan.'
      x-revenuecat-mcp-return-as-json: true
      x-revenuecat-release-gatekeeping: false
      tags:
      - Product
      parameters:
