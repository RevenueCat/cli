      type: object
      required:
      - app_id
      - store_identifier
      - type
      - display_name
      - title
      properties:
        app_id:
          description: The ID of the app within the project that the product belongs
            to.
          type: string
          minLength: 1
          maxLength: 255
          example: app1a2b3c4
        store_identifier:
          description: The store identifier for the RevenueCat product to target or
            create. App Store products use the iOS bundle product ID (e.g. `com.example.app.pro_monthly`).
            Play Store subscriptions use the compound form `<subscription_id>:<base_plan_id>`
            (e.g. `premium:monthly`), while Play Store one-time products use the plain
            product ID / SKU.
          type: string
          minLength: 1
          maxLength: 200
          example: com.example.app.pro_monthly
        type:
          description: The product type to create in RevenueCat. `one_time` is only
            supported for `play_store` products; App Store one-time purchases use
            `consumable`, `non_consumable`, or `non_renewing_subscription`.
          type: string
          enum:
          - consumable
          - non_consumable
          - non_renewing_subscription
          - one_time
          - subscription
          example: subscription
        display_name:
          description: The RevenueCat display name to use if the product is created.
          type: string
          minLength: 1
          maxLength: 512
          example: Pro Monthly
        title:
          description: The RevenueCat title to use if the product is created.
          type: string
          minLength: 1
          maxLength: 512
          example: Pro Monthly
      additionalProperties: false
