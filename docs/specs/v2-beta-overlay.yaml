        longer needed and is in a discardable state. Use this to clean up drafts,
        planned changes, or errored plans that the user does not want to apply. Discarding
        does not apply any store changes and does not undo a plan that has already
        been applied.
      x-revenuecat-mcp-return-as-json: true
      x-revenuecat-release-gatekeeping: false
      tags:
      - Product
      parameters:
