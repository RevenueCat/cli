          type: string
          format: uuid
          example: 4d5c046e-fadd-4d91-bd78-744fe44d314d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - desired_states
              properties:
                desired_states:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ProductStoreStatePlanDesiredState'
              additionalProperties: false
      responses:
        '200':
          description: Product store state plan updated.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - status
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 4d5c046e-fadd-4d91-bd78-744fe44d314d
                  object:
                    type: string
                    enum:
                    - product_store_state_plan
